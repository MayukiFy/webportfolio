<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p2-sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090514"/>
      <stop offset="60%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#6441a5"/>
    </linearGradient>
    <linearGradient id="p2-sun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="50%" stop-color="#ffb199"/>
      <stop offset="100%" stop-color="#ff52a2"/>
    </linearGradient>
    <filter id="p2-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#p2-sky)"/>

  <!-- Cyberpunk Giant Sun -->
  <circle cx="400" cy="220" r="110" fill="url(#p2-sun)" filter="url(#p2-glow)"/>
  <!-- Sun slices -->
  <rect x="280" y="220" width="240" height="4" fill="#090514"/>
  <rect x="280" y="240" width="240" height="6" fill="#090514"/>
  <rect x="280" y="265" width="240" height="9" fill="#090514"/>
  <rect x="280" y="295" width="240" height="12" fill="#090514"/>

  <!-- City Skyline Silhouette -->
  <!-- Layer 1 Back -->
  <path d="M 80 340 L 120 250 L 160 250 L 160 340 L 220 200 L 270 200 L 270 340 L 330 280 L 370 280 L 370 340 L 520 220 L 570 220 L 570 340 L 640 260 L 690 260 L 690 340 Z" fill="#1b1236" opacity="0.8"/>
  
  <!-- Layer 2 Front Buildings with Neon Windows -->
  <path d="M 30 350 L 80 280 L 140 280 L 140 350 L 180 310 L 240 310 L 240 350 L 480 350 L 530 290 L 590 290 L 590 350 L 650 320 L 720 320 L 720 350 Z" fill="#100a20"/>
  
  <!-- Neon Wireframe Lines on Buildings -->
  <line x1="80" y1="280" x2="80" y2="350" stroke="#00d2ff" stroke-width="2" filter="url(#p2-glow)"/>
  <line x1="140" y1="280" x2="140" y2="350" stroke="#ff52a2" stroke-width="2" filter="url(#p2-glow)"/>
  <line x1="240" y1="310" x2="240" y2="350" stroke="#00d2ff" stroke-width="2"/>
  <line x1="590" y1="290" x2="590" y2="350" stroke="#ff52a2" stroke-width="2" filter="url(#p2-glow)"/>

  <!-- Perspective Ground Grid -->
  <path d="M 0 350 L 800 350 L 800 500 L 0 500 Z" fill="#080312"/>
  <line x1="0" y1="350" x2="800" y2="350" stroke="#ff52a2" stroke-width="3" filter="url(#p2-glow)"/>
  <line x1="400" y1="350" x2="400" y2="500" stroke="#00d2ff" stroke-width="2"/>
  <line x1="400" y1="350" x2="200" y2="500" stroke="#00d2ff" stroke-width="1.5"/>
  <line x1="400" y1="350" x2="600" y2="500" stroke="#00d2ff" stroke-width="1.5"/>
  <line x1="400" y1="350" x2="50" y2="500" stroke="#ff52a2" stroke-width="1"/>
  <line x1="400" y1="350" x2="750" y2="500" stroke="#ff52a2" stroke-width="1"/>
  
  <line x1="0" y1="375" x2="800" y2="375" stroke="#00d2ff" stroke-width="1" opacity="0.5"/>
  <line x1="0" y1="410" x2="800" y2="410" stroke="#00d2ff" stroke-width="1.2" opacity="0.6"/>
  <line x1="0" y1="455" x2="800" y2="455" stroke="#00d2ff" stroke-width="1.5" opacity="0.8"/>

  <!-- Overlay Text & Tag -->
  <g transform="translate(40, 420)">
    <rect width="180" height="34" rx="17" fill="rgba(255, 82, 162, 0.2)" stroke="#ff52a2" stroke-width="1.5"/>
    <text x="90" y="22" fill="#ff52a2" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" text-anchor="middle">GRAPHIC DESIGN</text>
  </g>
  <text x="760" y="445" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" text-anchor="end">Neon Cyber City</text>
</svg>
