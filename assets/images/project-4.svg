<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p4-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="100%" stop-color="#141c38"/>
    </linearGradient>
    <linearGradient id="p4-card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#ff52a2"/>
    </linearGradient>
    <filter id="p4-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#p4-bg)"/>

  <!-- Left Mobile Mockup -->
  <g transform="translate(180, 70)" filter="url(#p4-shadow)">
    <!-- Phone Body -->
    <rect width="200" height="340" rx="30" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <!-- Screen -->
    <rect x="8" y="8" width="184" height="324" rx="24" fill="#1e293b"/>
    <!-- Notch -->
    <rect x="70" y="14" width="60" height="12" rx="6" fill="#0f172a"/>
    <!-- Virtual Card Inside Phone -->
    <rect x="20" y="45" width="160" height="95" rx="14" fill="url(#p4-card)"/>
    <circle cx="45" cy="70" r="10" fill="rgba(255,255,255,0.4)"/>
    <circle cx="58" cy="70" r="10" fill="rgba(255,255,255,0.4)"/>
    <text x="35" y="125" fill="#fff" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">•••• 8892</text>
    <!-- Graph inside Phone -->
    <path d="M 25 210 Q 60 170 95 195 T 175 160" fill="none" stroke="#00d2ff" stroke-width="3"/>
    <!-- Menu items placeholder -->
    <rect x="25" y="240" width="150" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
    <rect x="25" y="272" width="150" height="24" rx="6" fill="rgba(255,255,255,0.06)"/>
  </g>

  <!-- Right Mobile Mockup (Angled/Offset) -->
  <g transform="translate(420, 100)" filter="url(#p4-shadow)">
    <!-- Phone Body -->
    <rect width="200" height="340" rx="30" fill="#0f172a" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    <rect x="8" y="8" width="184" height="324" rx="24" fill="#131e36"/>
    <!-- Notch -->
    <rect x="70" y="14" width="60" height="12" rx="6" fill="#0f172a"/>
    <!-- Avatar circle & Welcome -->
    <circle cx="40" cy="55" r="16" fill="#ff52a2"/>
    <rect x="65" y="47" width="70" height="8" rx="4" fill="#fff" opacity="0.8"/>
    <rect x="65" y="60" width="45" height="6" rx="3" fill="#fff" opacity="0.4"/>
    <!-- Donut Chart -->
    <circle cx="100" cy="140" r="45" stroke="#1e293b" stroke-width="12" fill="none"/>
    <circle cx="100" cy="140" r="45" stroke="#00d2ff" stroke-width="12" stroke-dasharray="160 280" fill="none"/>
    <circle cx="100" cy="140" r="45" stroke="#ff52a2" stroke-width="12" stroke-dasharray="80 280" stroke-dashoffset="-160" fill="none"/>
    <!-- Metric Badges -->
    <rect x="25" y="215" width="70" height="40" rx="8" fill="rgba(0,210,255,0.15)"/>
    <rect x="105" y="215" width="70" height="40" rx="8" fill="rgba(255,82,162,0.15)"/>
  </g>

  <!-- Overlay Text & Tag -->
  <g transform="translate(40, 420)">
    <rect width="180" height="34" rx="17" fill="rgba(0, 210, 255, 0.2)" stroke="#00d2ff" stroke-width="1.5"/>
    <text x="90" y="22" fill="#00d2ff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" text-anchor="middle">UI/UX DESIGN</text>
  </g>
  <text x="760" y="445" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" text-anchor="end">FinFlow Mobile Banking</text>
</svg>
