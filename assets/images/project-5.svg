<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="p5-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18131d"/>
      <stop offset="50%" stop-color="#2c1a2e"/>
      <stop offset="100%" stop-color="#121829"/>
    </linearGradient>
    <linearGradient id="p5-lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="50%" stop-color="#ff52a2"/>
      <stop offset="100%" stop-color="#fbc2eb"/>
    </linearGradient>
    <filter id="p5-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" rx="16" fill="url(#p5-bg)"/>

  <!-- Camera Aperture & Shutter Visual Concept -->
  <circle cx="400" cy="220" r="140" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>
  <circle cx="400" cy="220" r="120" fill="none" stroke="url(#p5-lens)" stroke-width="4" filter="url(#p5-glow)"/>
  
  <!-- Aperture Blades -->
  <g stroke="rgba(255,255,255,0.7)" stroke-width="2" fill="none">
    <line x1="330" y1="160" x2="430" y2="140"/>
    <line x1="430" y1="140" x2="490" y2="210"/>
    <line x1="490" y1="210" x2="460" y2="290"/>
    <line x1="460" y1="290" x2="370" y2="300"/>
    <line x1="370" y1="300" x2="310" y2="230"/>
    <line x1="310" y1="230" x2="330" y2="160"/>
  </g>

  <!-- Viewfinder Frame Marks -->
  <path d="M 200 130 L 170 130 L 170 160" stroke="#00d2ff" stroke-width="3" fill="none"/>
  <path d="M 600 130 L 630 130 L 630 160" stroke="#00d2ff" stroke-width="3" fill="none"/>
  <path d="M 200 310 L 170 310 L 170 280" stroke="#ff52a2" stroke-width="3" fill="none"/>
  <path d="M 600 310 L 630 310 L 630 280" stroke="#ff52a2" stroke-width="3" fill="none"/>

  <!-- Center Focus Target -->
  <rect x="385" y="205" width="30" height="30" fill="none" stroke="#ff52a2" stroke-width="2"/>
  <circle cx="400" cy="220" r="4" fill="#00d2ff"/>

  <!-- Shutter speed / ISO HUD info -->
  <text x="220" y="150" fill="rgba(255,255,255,0.7)" font-family="'Consolas', monospace" font-size="12">1/250s  f/1.8  ISO 400</text>
  <text x="520" y="150" fill="#00d2ff" font-family="'Consolas', monospace" font-size="12">RAW + HDR</text>

  <!-- Overlay Text & Tag -->
  <g transform="translate(40, 420)">
    <rect width="180" height="34" rx="17" fill="rgba(255, 82, 162, 0.2)" stroke="#ff52a2" stroke-width="1.5"/>
    <text x="90" y="22" fill="#ff52a2" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" text-anchor="middle">PHOTOGRAPHY</text>
  </g>
  <text x="760" y="445" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="20" text-anchor="end">Portraits of Bangkok</text>
</svg>
